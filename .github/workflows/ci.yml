name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            build_type: Debug
            sanitizers: ON
            benchmarks: OFF
          - compiler: gcc
            cc: gcc
            cxx: g++
            build_type: Release
            sanitizers: OFF
            benchmarks: ON
          - compiler: clang
            cc: clang
            cxx: clang++
            build_type: Debug
            sanitizers: ON
            benchmarks: OFF
          - compiler: clang
            cc: clang
            cxx: clang++
            build_type: Release
            sanitizers: OFF
            benchmarks: ON
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc g++ clang

      # Benchmarks are compile-checked with -Werror on the Release legs only:
      # ASan and UBSan overhead would make their own numbers meaningless, so
      # there is no point building them under Debug. CI never *runs* them --
      # a shared, possibly throttled runner produces noisy and
      # non-representative timings, as BENCHMARKS.md's measurement-environment
      # note already cautions even for a dedicated machine. This catches build
      # breakage at the same bar as every other target; the reported numbers
      # come from running them directly, locally, before push.
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DSD_ENABLE_ASAN=${{ matrix.sanitizers }} \
            -DSD_ENABLE_UBSAN=${{ matrix.sanitizers }} \
            -DSD_BUILD_BENCHMARKS=${{ matrix.benchmarks }} \
            -DSD_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure
